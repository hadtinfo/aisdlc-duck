name: E2E

# Full end-to-end run is slow: run it on demand, weekly, and on PRs labelled "run-e2e".
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x" # latest patch of the go.mod version (security fixes)
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq bsdutils curl
      - name: Install Playwright Chromium and system deps
        run: |
          PW="$(jq -r .dependencies.playwright e2e/package.json)"
          npx --yes "playwright@$PW" install --with-deps chromium
      # Run twice to check that a re-run on the same machine is clean.
      - run: make e2e
      - run: make e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-out
          path: e2e/out/
          retention-days: 7
