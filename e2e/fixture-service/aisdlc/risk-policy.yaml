# Chính sách rủi ro của fixture E2E: mẫu generic cộng rule E1 (từ khóa "hạn mức" có trong BRD của PAY-1) → high.
# Mức high chỉ yêu cầu idempotent và invariant (không concurrent, không coverage) để E2E chạy nhanh.
schema: 1
preset: { name: generic, version: "1" }
levels: [low, medium, high]
default: low
rules:
  - { id: G1, kind: label, match: money-movement, level: high, note: Có dòng tiền hoặc giá trị đi qua }
  - { id: G2, kind: label, match: schema-change, level: medium, note: Đổi cấu trúc dữ liệu }
  - { id: G3, kind: label, match: auth, level: high, note: Đổi xác thực hoặc phân quyền }
  - { id: G4, kind: label, match: external-api, level: medium, note: Gọi hoặc mở API ngoài }
  - { id: E1, kind: keyword, match: "hạn mức", level: high, note: Chặn giao dịch theo hạn mức (E2E) }
classification:
  agent: raise
  devLower: reason
requirements:
  high:
    - { id: idempotent }
    - { id: invariant }
