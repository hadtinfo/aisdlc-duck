# Risk policy of the English E2E repo (locale: en): the fixture policy (schema 2, rules described in words) with the
# rule descriptions in English, so CLI output has no Vietnamese text.
schema: 2
preset: { name: generic, version: "3" }
levels: [low, medium, high]
default: low
rules:
  - { id: G1, describe: "Money or value moves (transfer, payment, refund, debit or credit of a balance)", level: high }
  - { id: G2, describe: "Data structure changes (add, change or drop a table or column, change a data type)", level: medium }
  - { id: G3, describe: "Authentication or authorization changes (login, token, role, access rights)", level: high }
  - { id: G4, describe: "Calls or exposes an external API (integration with another system, new public endpoint)", level: medium }
  - { id: E1, describe: "Blocks transactions by limit (E2E)", level: high }
classification:
  devLower: reason
requirements:
  high:
    - { id: idempotent }
    - { id: invariant }
