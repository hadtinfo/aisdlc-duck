# Chính sách rủi ro của repo flow-service (E2E quy trình theo mức): mẫu generic v2 (có flow) cộng rule T1 (bảng
# daily_limit → high). Không có rule từ khóa nên BRD nào cũng ở mức tạm low: BRD tự duyệt, PAY-1 nâng mức ở
# `submit design` (thiết kế chạm daily_limit). Mức high chỉ yêu cầu idempotent và invariant như fixture.
schema: 1
preset: { name: generic, version: "2" }
levels: [low, medium, high]
default: low
rules:
  - { id: G1, kind: label, match: money-movement, level: high, note: Có dòng tiền hoặc giá trị đi qua }
  - { id: G2, kind: label, match: schema-change, level: medium, note: Đổi cấu trúc dữ liệu }
  - { id: G3, kind: label, match: auth, level: high, note: Đổi xác thực hoặc phân quyền }
  - { id: G4, kind: label, match: external-api, level: medium, note: Gọi hoặc mở API ngoài }
  - { id: T1, kind: table, match: daily_limit, level: high, note: Bảng hạn mức ngày (E2E) }
classification:
  agent: raise
  devLower: reason
requirements:
  high:
    - { id: idempotent }
    - { id: invariant }
flow:
  low:    { brd: auto, design: auto, cases: auto, step: auto }
  medium: { brd: manual, design: manual, cases: manual, step: auto }
  high:   { brd: manual, design: manual, cases: manual, step: manual }
