# reset_sql runs before every case, including at S1: use only tables that already exist. A table created by a later
# step's migration is cleaned in the given.sql of a case of that step (as in C2).
reset_sql: []
stubs:
  - id: core-balance-ok
    request:  { method: GET, urlPath: /accounts/123/balance }
    response: { status: 200, jsonBody: { balance: 5000000 } }
cases:
  - id: C1
    step: S1
    kind: error
    title: Missing accountId returns 400
    given: { sql: [], stubs: [] }
    when:  { method: POST, path: /api/v1/limits/check, body: { amount: 100 } }
    then:  { status: 400, body: { code: "VALIDATION_ERROR" } }
  - id: C2
    step: S2
    kind: happy
    title: Enough balance and remaining limit returns 200
    given: { sql: ["DELETE FROM transfer_limit_usage"], stubs: [core-balance-ok] }
    when:  { method: POST, path: /api/v1/limits/check, body: { accountId: "123", amount: 100 } }
    then:
      status: 200
      body: { allowed: true }
      db:
        - query: "SELECT used_amount FROM transfer_limit_usage WHERE account_id = '123'"
          rows: [ { used_amount: 100 } ]
